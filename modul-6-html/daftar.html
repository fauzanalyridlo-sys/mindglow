<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Mulai Perjalananmu</title>
</head>

<body>

    <!-- Ilustrasi latar belakang (dekoratif) -->
    <img src="assets/images/ilustrasi-taman.webp" alt="">

    <main>
        <section>
            <header>
                <h1>Mulai Perjalananmu</h1>
                <p>Buat akun dan mulai kenali dirimu lebih baik.</p>
            </header>

            <form action="login.html" method="POST">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="kelompok5@gmail.com" required>
                </div>

                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="kelompok5" required>
                </div>

                <div>
                    <label for="password">Pasworrd</label>
                    <input type="password" id="password" name="password" placeholder="kelompok5" required>
                </div>

                <div>
                    <label for="confirm-password">Konfirmasi Pasworrd</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="kelompok5"
                        required>
                </div>
               
                <button type="submit">DAFTAR</button>
            </form>

            <footer>
                <p>Sudah punya akun? <a href="login.html">Masuk</a></p>
            </footer>
        </section>
    </main>

    <footer>
        <img src="assets/images/footer_login.png" alt="">
    </footer>
</body>

</html>
