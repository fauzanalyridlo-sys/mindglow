<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Email</title>
</head>

<body>
    <header>
        <h1>Konfirmasi Email</h1>
        <p>Silakan verifikasi email kamu untuk melanjutkan.</p>
    </header>

    <main>
        <section aria-labelledby="email-section">
            <h2 id="email-section">Verifikasi Email</h2>

            <form action="#" method="post">
                <p>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                    >
                </p>

                <p>
                    <button type="submit">Kirim Tautan Reset</button>
                </p>
            </form>

            <nav aria-label="Navigasi kembali">
                <a href="login.html">Kembali ke login</a>
            </nav>
        </section>
    </main>

    <footer>
         <img
        src="assets/images/login.png"
        alt=""
    >
    </footer>
</body>
</html>
