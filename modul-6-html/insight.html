            <article>
                <h3>Skala Mood</h3>

                <figure>
                    <figcaption>Grafik skala mood selama tujuh hari terakhir</figcaption>

                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 600 370"
                         width="600"
                         height="370"
                         role="img"
                         aria-label="Grafik skala mood dari 2.0 hingga 4.0 untuk hari Rabu sampai Selasa">

                        <g stroke="currentColor" stroke-width="2">
                            <line x1="175" y1="220" x2="175" y2="300"/>
                            <line x1="295" y1="95" x2="295" y2="300"/>
                            <line x1="415" y1="170" x2="415" y2="300"/>
                        </g>

                        <g fill="currentColor" font-size="17" text-anchor="middle">
                            <text x="80" y="345">Rabu</text>
                            <text x="155" y="345">Kamis</text>

                            <text x="530" y="345">Selasa</text>
