<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - MindGlow</title>
</head>

<body>
    <header>
        <h1>Halo, Selamat Datang Kembali</h1>
    </header>

    <main>
        <section aria-labelledby="login-title">
            <h2 id="login-title">Masuk</h2>

            <form action="home_dashboard.html" method="post">
    <p>
        <label for="username">Email/Username</label>
        <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
        >
    </p>

    <p>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >
    </p>

    <p>
            
        <button type="submit">MASUK</button>
       
    </p>
</form>
            <p>
                <a href="login_data_tidakvalid.html">
                    Lihat contoh login tidak berhasil
                </a>
            </p>

            <nav aria-label="Navigasi akun">
                <ul>
                    <li>
                        <a href="tautan_reset_pw.html">Lupa sandi</a>
                    </li>
                    <li>
                        <span>Belum punya akun?</span>
                        <a href="daftar.html">Daftar sekarang</a>
                    </li>
                </ul>
            </nav>
        </section>
    </main>

    <footer>
        <img src="assets/images/footer_login.png" alt="">
    </footer>
</body>
</html>
