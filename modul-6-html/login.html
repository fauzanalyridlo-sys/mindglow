<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang Kembali</title>
</head>

<body>
    <header>
        <h1>Halo</h1>
        <p>Selamat Datang Kembali</p>
    </header>

    <main>
        <section aria-labelledby="login-title">
            <h2 id="login-title">Masuk</h2>

            <form action="#" method="post">
                <p>
                    <label for="username">Email/Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                    >
                </p>

                <p>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        aria-label="Tampilkan password"
                    >
                        Tampilkan password
                    </button>
                </p>

            <p>
                <a href="home_dashboard.html">MASUK</a>
            </p>
            </form>

            <nav aria-label="Navigasi akun">
                <ul>
                    <li>
                        <a href="lupa-password.html">Lupa sandi</a>
                    </li>
                    <li>
                        <span>Belum Punya Akun?</span>
                        <a href="daftar.html">Daftar sekarang</a>
                    </li>
                </ul>
            </nav>

            <img
                src="assets/images/login-illustration.webp"
                alt=""
            >
        </section>
    </main>
</body>
</html>
