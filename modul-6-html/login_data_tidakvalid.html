<section aria-labelledby="login-error-title">
    <h1 id="login-error-title">Login Tidak Berhasil</h1>

    <p role="alert">
        Sepertinya email/username atau password belum sesuai.
    </p>

    <p>Yuk, coba periksa kembali.</p>

    <form action="#" method="post">
        <p>
            <label for="username">Email/Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
            >
        </p>

        <p>
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
            >
        </p>

        <p>
            <button type="submit">MASUK</button>
        </p>
    </form>

    <nav aria-label="Navigasi akun">
        <ul>
            <li>
                <a href="tautan_reset_pw.html">Lupa sandi</a>
            </li>
            <li>
                <span>Belum Punya Akun?</span>
                <a href="daftar.html">Daftar sekarang</a>
            </li>
        </ul>
    </nav>

    <img
        src="assets/images/login.png"
        alt=""
    >
</section>
