
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berhasil Menambahkan Tugas - MindGlow</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #303d50;
    background: #f0f1ed;
}

.background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 0;
}

.overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(34, 42, 35, 0.28);
}

.popup {
    width: 310px;
    max-width: 100%;
    padding: 28px 24px;
    text-align: center;
    background: #fffefa;
    border: 1px solid #bfd4c7;
    border-radius: 18px;
    box-shadow: 0 5px 12px rgba(0,0,0,0.15);
}

.icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #dcebe0;
    color: #719780;
    font-size: 34px;
    font-weight: bold;
}

h2 {
    margin: 0 0 10px;
    font-size: 20px;
}

p {
    margin: 0 0 22px;
    font-size: 12px;
    line-height: 1.6;
}

button {
    width: 86px;
    padding: 9px;
    border: none;
    border-radius: 22px;
    background: #86a999;
    color: white;
    cursor: pointer;
    font-size: 13px;
}

button:hover {
    background: #719786;
}
</style>
</head>

<body>

<iframe class="background" src="akademik.html"
        title="Halaman Akademik MindGlow"></iframe>

<div class="overlay">
    <div class="popup">
        <div class="icon">✓</div>
        <h2>Berhasil!</h2>
        <p>Tugas berhasil ditambahkan ke daftar akademik.</p>
        <button onclick="window.location.href='akademik.html'">
            Oke
        </button>
    </div>
</div>

</body>
</html>
